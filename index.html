<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-[#5.0]" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Chaurasiya Samaj Nepal - Official Portal & Community Platform</title>
    <meta name="title" content="Chaurasiya Samaj Nepal - Official Portal & Community Platform" />
    <meta name="description" content="Official website of Chaurasiya Samaj Nepal. Empowering Chaurasiya community through verified members directory, matrimonial portal, cultural heritage, events calendar, volunteer registry and welfare donation." />
    <meta name="keywords" content="Chaurasiya Samaj Nepal, Chaurasiya Samaj, Chaurasiya Matrimonial, Chaurasiya Directory, Parsa Nepal, Birgunj Chaurasiya, Chaurasiya Community Nepal, Chaurasiya NGO" />
    <meta name="author" content="Chaurasiya Samaj Nepal - Central Executive Committee" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://csnepal.org" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://csnepal.org" />
    <meta property="og:title" content="Chaurasiya Samaj Nepal - Official Portal & Community Hub" />
    <meta property="og:description" content="Connecting hearts, preserving heritage, and fostering socio-economic empowerment across Chaurasiya Samaj Nepal." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&q=80&w=1200" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chaurasiya Samaj Nepal - Official Portal" />
    <meta name="twitter:description" content="Explore committee directory, matrimony profiles, community events and welfare initiatives." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&q=80&w=1200" />

    <!-- Performance & Preconnect Optimization -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Schema.org JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Chaurasiya Samaj Nepal",
        "alternateName": "चौरसिया समाज नेपाल",
        "url": "https://csnepal.org",
        "logo": "https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&q=80&w=400",
        "email": "csnepalwebsite@gmail.com",
        "telephone": "+977-9845012345",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Birgunj Ward 8",
          "addressLocality": "Birgunj",
          "addressRegion": "Parsa, Madhesh Pradesh",
          "addressCountry": "NP"
        },
        "sameAs": [
          "https://facebook.com",
          "https://twitter.com"
        ]
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root">
      <div class="initial-loader-wrapper">
        <style>
          .initial-loader-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            z-index: 9999;
            padding: 1rem;
          }
          .initial-loader-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 380px;
            width: 100%;
            padding: 2.25rem 1.75rem;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(20, 184, 166, 0.25);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(13, 148, 136, 0.2);
            backdrop-filter: blur(16px);
          }
          .initial-loader-logo-ring {
            position: relative;
            width: 76px;
            height: 76px;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          .initial-loader-spinner {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3.5px solid transparent;
            border-top-color: #10b981;
            border-right-color: #14b8a6;
            border-bottom-color: #f59e0b;
            animation: spin-loader 1.2s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
          }
          .initial-loader-icon {
            width: 38px;
            height: 38px;
            color: #10b981;
            animation: pulse-leaf 2s ease-in-out infinite;
          }
          .initial-loader-title {
            color: #f8fafc;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin: 0 0 0.25rem 0;
            line-height: 1.2;
          }
          .initial-loader-subtitle {
            color: #34d399;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin: 0 0 1.25rem 0;
          }
          .initial-loader-progress-track {
            width: 100%;
            height: 4px;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
          }
          .initial-loader-progress-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -100%;
            width: 100%;
            background: linear-gradient(90deg, transparent, #10b981, #14b8a6, #f59e0b, transparent);
            animation: shimmer-bar 1.5s ease-in-out infinite;
          }
          @keyframes spin-loader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes pulse-leaf {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.7)); }
          }
          @keyframes shimmer-bar {
            0% { left: -100%; }
            100% { left: 100%; }
          }
        </style>
        <div class="initial-loader-card">
          <div class="initial-loader-logo-ring">
            <div class="initial-loader-spinner"></div>
            <img src="/assets/images/chaurasiya_logo_1784519579895.jpg" id="initialLoaderIcon" alt="Chaurasiya Samaj Nepal" class="initial-loader-icon" style="width: 52px; height: 52px; object-fit: cover; border-radius: 9999px;" />
            <script>
              fetch('/site_texts.json')
                .then(r => {
                  const contentType = r.headers.get('content-type');
                  if (r.ok && contentType && contentType.includes('application/json')) {
                    return r.json();
                  }
                  throw new Error('Not JSON or fetch failed');
                })
                .then(d => {
                  const img = document.getElementById('initialLoaderIcon');
                  if (img && d && d.logoUrl) {
                    img.src = d.logoUrl;
                  }
                })
                .catch(e => console.warn('Could not load dynamic logo, using default:', e));
            </script>
          </div>
          <h2 class="initial-loader-title">Chaurasiya Samaj Nepal</h2>
          <p class="initial-loader-subtitle">चौरसिया समाज नेपाल</p>
          <div class="initial-loader-progress-track">
            <div class="initial-loader-progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
